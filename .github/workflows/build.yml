name: Build App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      platform:
        description: 'Platform to build'
        required: true
        default: 'Both'
        type: choice
        options:
          - Android
          - iOS
          - Both

jobs:
  build-android:
    if: ${{ github.event.inputs.platform == 'Android' || github.event.inputs.platform == 'Both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/release.jks

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleRelease -PversionName=${{ github.event.inputs.version }} --no-daemon
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

  build-ios:
    if: ${{ github.event.inputs.platform == 'iOS' || github.event.inputs.platform == 'Both' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Shared Framework
        run: ./gradlew :shared:assembleRelease

      - name: Build iOS App
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $GITHUB_WORKSPACE/iosApp.xcarchive \
            MARKETING_VERSION=${{ github.event.inputs.version }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create Dummy IPA
        run: |
          mkdir -p Payload
          cp -r $GITHUB_WORKSPACE/iosApp.xcarchive/Products/Applications/*.app Payload/
          zip -r Stash.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: Stash.ipa
